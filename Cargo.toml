[package]
name = "stompymux-rs"
version = "0.1.0"
edition = "2024"
autotests = false

[features]
lua-type-updater = []

[[bin]]
name = "lua-type-updater"
path = "src/bin/lua-type-updater.rs"
required-features = ["lua-type-updater"]

[dependencies]
tempfile = "3.27.0"
nix = { version = "0.31.3", default-features = false, features = ["resource", "feature"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
anyhow = "1.0.104"
argon2 = "0.6.0"
clap = { version = "4.6.6", features = ["derive"] }
mlua = { version = "0.12.1", features = ["luajit", "vendored", "serialize"] }
rand = "0.10.2"
regex = "1.13.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = { version = "1.1.5", features = ["preserve_order"] }
unicode-width = "0.2.2"
zeroize = { version = "1.9.0", features = ["derive"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
unicode-segmentation = "1.13.3"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
rand_chacha = { version = "0.10.0", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }

[profile.dev]
debug = "line-tables-only"

[profile.test]
opt-level = 1
debug = "line-tables-only"
incremental = false

[profile.test.package."*"]
debug = 0

# Consolidated integration suites; scenario files stay in tests/ for fixture paths.
