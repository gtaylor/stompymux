[package]
name = "stompymux-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
argon2 = "0.5"
clap = { version = "4", features = ["derive"] }
mlua = { version = "0.11", features = ["luajit", "vendored", "serialize"] }
rand = "0.8"
regex = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
unicode-width = "0.2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
