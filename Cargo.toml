[package]
name = "stompymux-rs"
version = "0.1.0"
edition = "2024"
autotests = false

[workspace]
members = ["crates/lua-tools", "crates/mapgen", "tests/support"]
default-members = [".", "crates/lua-tools", "crates/mapgen"]

[features]
mappy = ["dep:iced"]

[[bin]]
name = "mappy"
path = "src/bin/mappy/main.rs"
required-features = ["mappy"]

[[bin]]
name = "autopilot-bench"
path = "src/bin/autopilot-bench.rs"

[dependencies]
tempfile = "3.27.0"
nix = { version = "0.31.3", default-features = false, features = ["resource", "feature", "signal", "process"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
anyhow = "1.0.104"
argon2 = "0.6.0"
clap = { version = "4.6.6", features = ["derive"] }
mlua = { version = "0.12.1", features = ["luajit", "vendored", "serialize"] }
rand = "0.10.2"
regex = "1.13.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
# `test-util` (paused clocks for tests) is enabled here rather than only as a
# dev-dependency feature. A dev-only feature changes tokio's build under `cargo
# test`, which forces `cargo build` and `cargo run` to recompile tokio and the
# whole server crate separately. Outside a paused test clock it costs nothing.
tokio = { version = "1.53.1", features = ["full", "test-util"] }
toml = { version = "1.1.5", features = ["preserve_order"] }
unicode-width = "0.2.2"
zeroize = { version = "1.9.0", features = ["derive"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
unicode-segmentation = "1.13.3"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
rand_chacha = { version = "0.10.0", features = ["serde"] }
csv = "1.4.0"
sha2 = "0.11.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "ansi", "env-filter", "json", "registry", "smallvec"] }
tracing-appender = "0.2.5"
iced = { version = "0.14.0", optional = true }

[dev-dependencies]
stompymux-mapgen = { path = "crates/mapgen", default-features = false }
stompymux-test-support = { path = "tests/support" }

# Autopilot and contract helpers pass world, unit, and tuning state explicitly
# rather than bundling them into single-use structs.
[lints.clippy]
too_many_arguments = "allow"

# Debug info is off by default to cut compile, link, and disk costs. Opt back
# in for a debugger session with `CARGO_PROFILE_DEV_DEBUG=true`.
#
# Workspace crates build unoptimized: optimizing the sixteen integration suites
# cost roughly 3,000 CPU-seconds per clean build while barely changing how
# long they take to run, because the hot paths live in the server crate and
# its dependencies. Dependencies are optimized instead; they rarely change, so
# that cost is paid once per lockfile and then cached.
#
# `cargo test` uses the `test` profile, which inherits everything here. Keep it
# free of overrides: when `dev` and `test` match, `cargo build`, `cargo run`,
# and `cargo test` share one set of compiled artifacts instead of each
# rebuilding the 200k-line server crate.
[profile.dev]
debug = false

[profile.dev.package."*"]
opt-level = 3

# Mappy's window, input handling and GPU setup run through iced and wgpu, which are sluggish
# unoptimized. This profile optimizes every dependency fully and this crate lightly, so
# `just mappy` stays responsive while an edit to Mappy still rebuilds incrementally.
[profile.mappy]
inherits = "dev"
opt-level = 1

[profile.mappy.package."*"]
opt-level = 3

# Consolidated integration suites; scenario files stay in tests/ for fixture paths.
[[test]]
name = "btech_01"
path = "tests/suites/btech_01.rs"

[[test]]
name = "btech_02"
path = "tests/suites/btech_02.rs"

[[test]]
name = "btech_03"
path = "tests/suites/btech_03.rs"

