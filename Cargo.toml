[package]
name = "stompymux-rs"
version = "0.1.0"
edition = "2024"
autotests = false

[workspace]
members = ["tests/support"]

[features]
lua-type-updater = []
lua-doc-updater = []

[[bin]]
name = "lua-type-updater"
path = "src/bin/lua-type-updater.rs"
required-features = ["lua-type-updater"]

[[bin]]
name = "lua-doc-updater"
path = "src/bin/lua-doc-updater.rs"
required-features = ["lua-doc-updater"]

[[bin]]
name = "autopilot-bench"
path = "src/bin/autopilot-bench.rs"

[dependencies]
tempfile = "3.27.0"
nix = { version = "0.31.3", default-features = false, features = ["resource", "feature", "signal", "process"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
anyhow = "1.0.104"
argon2 = "0.6.0"
clap = { version = "4.6.6", features = ["derive"] }
mlua = { version = "0.12.1", features = ["luajit", "vendored", "serialize"] }
rand = "0.10.2"
regex = "1.13.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = { version = "1.1.5", features = ["preserve_order"] }
unicode-width = "0.2.2"
zeroize = { version = "1.9.0", features = ["derive"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
unicode-segmentation = "1.13.3"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
rand_chacha = { version = "0.10.0", features = ["serde"] }
csv = "1.4.0"
sha2 = "0.11.0"

[dev-dependencies]
stompymux-test-support = { path = "tests/support" }
tokio = { version = "1.53.1", features = ["test-util"] }

# Autopilot and contract helpers pass world, unit, and tuning state explicitly
# rather than bundling them into single-use structs.
[lints.clippy]
too_many_arguments = "allow"

[profile.dev]
debug = "line-tables-only"

# `cargo test` compiles the whole library twice (unit-test binary plus the
# rlib the suites link) and sixteen suite binaries. Light optimization keeps
# the BattleTech simulations quick at run time; incremental compilation makes
# an edit-and-retest cycle cost seconds instead of a full crate rebuild; and
# skipping rustc's local ThinLTO pass removes roughly 40% of each crate's
# codegen time for a few percent of test run time.
[profile.test]
opt-level = 1
debug = "line-tables-only"
incremental = true
lto = "off"

[profile.test.package."*"]
debug = 0

# Consolidated integration suites; scenario files stay in tests/ for fixture paths.
[[test]]
name = "btech_01"
path = "tests/suites/btech_01.rs"

[[test]]
name = "btech_02"
path = "tests/suites/btech_02.rs"

[[test]]
name = "btech_03"
path = "tests/suites/btech_03.rs"

