# Outfit name grammar and word lists.
#
# A pattern is literal text with {slot} placeholders. Slots backed by lists below are
# adjective, noun, suffix, color and place. Two slots are derived: ordinal gives a regiment
# number ("21st") and possessive gives a commander's family name from the chosen culture
# ("Reyes'"). A pattern with no `flavors` is open to every flavor.
#
# Each word list has a `common` core that every flavor draws from, plus optional `house`,
# `periphery` and `pirate` additions. Entries must be unique within a list and free of
# surrounding whitespace. Keep every entry original: do not add named units from published
# fiction.

# Fragments that must never appear in a generated name, compared ignoring case. These keep
# accidental collisions with well-known fictional units out of the output.
blocked = [
    "Grey Death",
    "Gray Death",
    "Light Horse",
    "Highlanders",
    "Dragoons of",
    "Kell",
    "Wolf's",
    "Wolfs",
]

[[patterns]]
template = "{adjective} {noun} {suffix}"
weight = 28

[[patterns]]
template = "{possessive} {suffix}"
weight = 20

[[patterns]]
template = "{ordinal} {place} {suffix}"
weight = 16
flavors = ["house", "periphery"]

[[patterns]]
template = "{noun} {suffix}"
weight = 14

[[patterns]]
template = "{color} {suffix}"
weight = 10

[[patterns]]
template = "{place} {suffix}"
weight = 10

[[patterns]]
template = "{adjective} {suffix}"
weight = 8

[[patterns]]
template = "{possessive} {adjective} {suffix}"
weight = 8
flavors = ["pirate", "periphery"]

[[patterns]]
template = "{ordinal} {adjective} {suffix}"
weight = 6
flavors = ["house"]

[[patterns]]
template = "{color} {noun} {suffix}"
weight = 6

