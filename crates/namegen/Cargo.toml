[package]
name = "stompymux-namegen"
version = "0.1.0"
edition = "2024"
description = "Seeded mercenary outfit, pilot and callsign name generation"
publish = false

# The `cli` feature only adds the `namegen` binary; embedders can depend on this
# crate with `default-features = false`.
[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "namegen"
path = "src/bin/namegen.rs"
required-features = ["cli"]

[dependencies]
stompymux-seeded-rng = { path = "../seeded-rng" }
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = { version = "1.1.5", features = ["preserve_order"] }
