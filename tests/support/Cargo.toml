[package]
name = "stompymux-test-support"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "lib.rs"

[dependencies]
stompymux-rs = { path = "../.." }
anyhow = "1.0.104"
mlua = { version = "0.12.1", features = ["luajit", "vendored", "serialize"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
