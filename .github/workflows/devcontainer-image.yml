name: Publish devcontainer image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .devcontainer/Dockerfile
      - .devcontainer/install-tools.sh
      - .devcontainer/install-rust.sh
      - .devcontainer/lib.sh
      - rust-toolchain.toml
      - .github/workflows/devcontainer-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: devcontainer-image
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/gtaylor/stompymux-devcontainer

jobs:
  publish:
    name: Build, verify, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up emulation for ARM64
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build verification image
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          load: true
          tags: stompymux-devcontainer:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify development tools
        run: |
          docker run --rm stompymux-devcontainer:verify bash -lc '
            set -euo pipefail
            test "$(id -un)" = vscode
            cargo --version
            rustfmt --version
            cargo clippy --version
            cargo nextest --version
            just --version
            stylua --version
            lua-language-server --version
            node --version
            npm --version
            go version
            hugo version | grep -F "+extended"
            test -w /opt/lua-language-server-3.19.1/meta
          '

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multiarch image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report immutable digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          {
            echo '## Published devcontainer image'
            echo
            echo "\`$IMAGE_NAME@$IMAGE_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
