name: Build and test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.configuration.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - name: Sanitizers
            build_type: RelWithDebInfo
            asan: "ON"
            ubsan: "ON"
          - name: Release strict C23
            build_type: Release
            asan: "OFF"
            ubsan: "OFF"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build and test in devcontainer
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          env: |
            GITHUB_ACTIONS=true
            CMAKE_BUILD_TYPE=${{ matrix.configuration.build_type }}
            BTECH_ENABLE_ASAN=${{ matrix.configuration.asan }}
            BTECH_ENABLE_UBSAN=${{ matrix.configuration.ubsan }}
            BTECH_STRICT_C23=ON
          push: never
          runCmd: |
            set -euo pipefail
            just ci-build-test
            grep -Fx "CMAKE_BUILD_TYPE:STRING=$CMAKE_BUILD_TYPE" .build/CMakeCache.txt
            grep -Fx "BTECH_ENABLE_ASAN:BOOL=$BTECH_ENABLE_ASAN" .build/CMakeCache.txt
            grep -Fx "BTECH_ENABLE_UBSAN:BOOL=$BTECH_ENABLE_UBSAN" .build/CMakeCache.txt
            grep -Fx "BTECH_STRICT_C23:BOOL=$BTECH_STRICT_C23" .build/CMakeCache.txt
            git diff --exit-code

  analysis:
    name: Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Analyze in devcontainer
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          env: |
            GITHUB_ACTIONS=true
            CMAKE_BUILD_TYPE=Release
            BTECH_ENABLE_ASAN=OFF
            BTECH_ENABLE_UBSAN=OFF
            BTECH_STRICT_C23=ON
          push: never
          runCmd: |
            set -euo pipefail
            just ci-analysis
            grep -Fx "CMAKE_BUILD_TYPE:STRING=$CMAKE_BUILD_TYPE" .build/CMakeCache.txt
            grep -Fx "BTECH_ENABLE_ASAN:BOOL=$BTECH_ENABLE_ASAN" .build/CMakeCache.txt
            grep -Fx "BTECH_ENABLE_UBSAN:BOOL=$BTECH_ENABLE_UBSAN" .build/CMakeCache.txt
            grep -Fx "BTECH_STRICT_C23:BOOL=$BTECH_STRICT_C23" .build/CMakeCache.txt
            git diff --exit-code

  fuzz:
    name: Fuzz smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build and run fuzz smoke tests in devcontainer
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          env: |
            GITHUB_ACTIONS=true
          push: never
          runCmd: |
            set -euo pipefail
            just fuzz-smoke
            git diff --exit-code
